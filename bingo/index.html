<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hello bingo</title>
<link rel="stylesheet" href="https://use.typekit.net/pgu7sez.css">
<style>
:root{--pink:#e82a8f;--ice:#cdd9f3;--glow:#c9e3f8;--deep:#b3126a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--pink);color:var(--ice);font-family:"neue-haas-grotesk-text",system-ui,sans-serif;font-weight:700;min-height:100vh;min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;justify-content:center;overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:520px;position:relative;z-index:1}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,#e6a3cb 38%,rgba(232,42,143,0) 70%);animation:breathe 7s ease-in-out infinite alternate}
.o1{width:min(110vw,760px);aspect-ratio:1;top:-8vh;right:-25vw}
.o2{--r:min(40vw,280px);width:calc(var(--r)*2);aspect-ratio:1;top:calc(56% - var(--r));left:-32vw;animation-delay:-2.5s;animation-duration:9s}
.o3{width:min(80vw,560px);aspect-ratio:1;bottom:-6vh;right:-30vw;animation-delay:-5s;animation-duration:8s}
@keyframes breathe{from{transform:scale(.9);opacity:.7}to{transform:scale(1.12);opacity:1}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
h1{margin:0 0 44px;font-family:"gunter",sans-serif;font-weight:400;font-size:clamp(3.6rem,19vw,6.2rem);line-height:.88;letter-spacing:-.02em;text-transform:lowercase}
h1 span{display:block}
h1 span+span{text-align:right}
#sub{margin:0 0 36px;text-align:center;font-family:"gunter",sans-serif;font-weight:400;font-size:clamp(1.6rem,8vw,2.2rem);line-height:1}
#sub:empty{display:none}
#grid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{aspect-ratio:1;border:0;padding:3px;font-family:"neue-haas-grotesk-display",sans-serif;font-size:clamp(.58rem,2.9vw,.8rem);font-weight:700;line-height:1.1;overflow-wrap:anywhere;hyphens:auto;color:#fff;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:0;background:var(--pink);box-shadow:inset 0 0 0 1.5px rgba(205,217,243,.55);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0}
.cell.done{background:none;box-shadow:0 0 0 2px var(--ice),0 0 16px rgba(201,227,248,.6);z-index:1}
.cell.busy{opacity:.5}
.ring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid var(--ice);border-radius:50%;pointer-events:none}
#banner{margin:16px 0 4px;text-align:center;font-weight:800;font-size:1.4rem;min-height:1.5em}
#dl{display:block;margin:12px auto;font:inherit;font-weight:800;padding:14px 22px;border:0;border-radius:999px;background:var(--ice);color:var(--pink);cursor:pointer}
#join{display:flex;gap:8px;margin:22px 0}
input[type=text]{flex:1;min-width:0;font:inherit;padding:13px 16px;border-radius:999px;border:0;color:var(--deep)}
#go{font:inherit;font-weight:800;padding:13px 20px;border:0;border-radius:999px;background:var(--ice);color:var(--pink);cursor:pointer}
#msg{min-height:1.4em;margin-top:10px}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
#viewer{position:fixed;inset:0;background:rgba(120,10,70,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
#viewer img{max-width:100%;max-height:70vh;max-height:70dvh}
#viewer button{font:inherit;font-weight:800;padding:10px 18px;border-radius:999px;border:0;cursor:pointer;background:var(--ice);color:var(--pink)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="app">
  <h1><span>hello</span><span>bingo</span></h1>
  <p id="sub"></p>
  <div id="join" hidden>
    <input id="name" type="text" placeholder="Your name" maxlength="30" aria-label="Your name">
    <button id="go">aizie bļe</button>
  </div>
  <div id="banner" aria-live="polite"></div>
  <div id="grid"></div>
  <button id="dl" hidden>iekačāt bingo</button>
  <div id="msg" aria-live="polite"></div>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="viewer">
  <img id="big" alt="Submitted photo">
  <div><button id="replace">Aizvietot attēlu</button> <button id="close">Aizvērt</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://archhxegbrzpaqwrzakh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyY2hoeGVnYnJ6cGFxd3J6YWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NDk5ODksImV4cCI6MjEwOTQyNTk4OX0.m0DgPAU_IUN7dAIa_SMMKis8nLNnEVDgw3GbOU2DBKk";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let me, cells = [], subs = {}, activeCell = null;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

const LINES = [];
for (let i = 0; i < 5; i++) {
  LINES.push([0,1,2,3,4].map(j => i*5+j), [0,1,2,3,4].map(j => j*5+i));
}
LINES.push([0,6,12,18,24], [4,8,12,16,20]);

const say = t => $("msg").textContent = t || "";
const urlFor = s => sb.storage.from("bingo").getPublicUrl(s.path).data.publicUrl + "?v=" + encodeURIComponent(s.created_at);

async function init() {
  let { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const { data, error } = await sb.auth.signInAnonymously();
    if (error) return say("Could not sign in: " + error.message);
    session = data.session;
  }
  me = session.user;
  const { data: player } = await sb.from("players").select("*").eq("id", me.id).maybeSingle();
  if (!player) { $("join").hidden = false; return; }
  start(player);
}

$("go").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) return say("Enter a name first.");
  const { data, error } = await sb.from("players").insert({ id: me.id, name }).select().single();
  if (error) return say("Could not save name: " + error.message);
  $("join").hidden = true; say(""); start(data);
};

async function start(player) {
  $("sub").textContent = "ciu " + player.name + "!";
  const [c, s] = await Promise.all([
    sb.from("cells").select("*").order("id"),
    sb.from("submissions").select("*").eq("player_id", me.id)
  ]);
  if (c.error || s.error) return say("Could not load the card.");
  cells = c.data; s.data.forEach(r => subs[r.cell_id] = r);
  render();
}

function render() {
  const g = $("grid"); g.innerHTML = "";
  cells.forEach(cell => {
    const b = document.createElement("button");
    b.className = "cell"; b.dataset.id = cell.id;
    const s = subs[cell.id];
    if (s) {
      b.classList.add("done");
      const im = document.createElement("img");
      im.crossOrigin = "anonymous"; im.alt = cell.label; im.src = urlFor(s);
      b.appendChild(im);
    } else b.textContent = cell.label;
    b.onclick = () => s ? openViewer(cell.id) : pick(cell.id);
    g.appendChild(b);
  });
  const done = new Set(Object.keys(subs).map(Number));
  const n = LINES.filter(l => l.every(i => done.has(i))).length;
  $("banner").textContent = done.size === 25 ? "Full card!" : n ? "BINGO! " + n + (n === 1 ? " line" : " lines") : "";
  $("dl").hidden = done.size !== 25;
}

// ---------- animations ----------
const cellEl = id => $("grid").querySelector('[data-id="' + id + '"]');
function pop(id, delay, scale) {
  const el = cellEl(id);
  if (el && !calm) el.animate([{ transform: "scale(1)" }, { transform: "scale(" + scale + ")" }, { transform: "scale(1)" }],
    { duration: 520, delay, easing: "ease-in-out" });
}

function celebrate(id, before) {
  const after = new Set(before).add(id);
  if (after.size === 25) return ripple(id);
  const lines = LINES.filter(l => l.includes(id) && l.every(i => after.has(i)));
  if (!lines.length) return pop(id, 0, 1.12);
  const delays = new Map();   // wave travels outward from the last completed square, in every finished line
  lines.forEach(l => {
    const k = l.indexOf(id);
    l.forEach((cid, idx) => {
      const d = Math.abs(idx - k) * 90;
      delays.set(cid, Math.min(d, delays.has(cid) ? delays.get(cid) : d));
    });
  });
  delays.forEach((d, cid) => pop(cid, d, cid === id ? 1.22 : 1.16));
}

function ripple(id) {
  const x0 = id % 5, y0 = Math.floor(id / 5), step = 110;
  for (let cid = 0; cid < 25; cid++) {
    const dist = Math.hypot((cid % 5) - x0, Math.floor(cid / 5) - y0);
    pop(cid, dist * step, 1.25);
  }
  const el = cellEl(id), g = $("grid");
  if (!el || calm) return;
  const ring = document.createElement("div");
  ring.className = "ring";
  ring.style.left = el.offsetLeft + el.offsetWidth / 2 + "px";
  ring.style.top = el.offsetTop + el.offsetHeight / 2 + "px";
  g.appendChild(ring);
  const scale = (6 * el.offsetWidth * 2) / 20;
  ring.animate([{ transform: "scale(1)", opacity: .9 }, { transform: "scale(" + scale + ")", opacity: 0 }],
    { duration: 6 * step, easing: "linear" }).onfinish = () => ring.remove();
}

// ---------- viewer + upload ----------
function pick(id) { activeCell = id; $("file").value = ""; $("file").click(); }
function openViewer(id) { activeCell = id; $("big").src = urlFor(subs[id]); $("viewer").style.display = "flex"; }
$("close").onclick = () => $("viewer").style.display = "none";
$("replace").onclick = () => { $("viewer").style.display = "none"; pick(activeCell); };

async function compress(file, max = 1600) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let blob = await new Promise(r => cv.toBlob(r, "image/webp", 0.8));
  if (!blob || blob.type !== "image/webp") blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.8));
  return blob;
}

$("file").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  const id = activeCell, el = cellEl(id);
  el.classList.add("busy"); say("Uploading…");
  try {
    const blob = await compress(file);
    const path = me.id + "/" + id + (blob.type === "image/webp" ? ".webp" : ".jpg");
    const up = await sb.storage.from("bingo").upload(path, blob, { upsert: true, contentType: blob.type });
    if (up.error) throw up.error;
    const row = { player_id: me.id, cell_id: id, path, created_at: new Date().toISOString() };
    const { error } = await sb.from("submissions").upsert(row);
    if (error) throw error;
    const before = new Set(Object.keys(subs).map(Number)), wasNew = !subs[id];
    subs[id] = row; say(""); render();
    wasNew ? celebrate(id, before) : pop(id, 0, 1.12);
  } catch (err) {
    say("Upload failed: " + (err.message || err)); el.classList.remove("busy");
  }
};

// ---------- download the finished card as an image ----------
const loadImg = u => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = rej; i.src = u; });

$("dl").onclick = async () => {
  say("Making your image…");
  try {
    const W = 1080, H = 1500, GAP = 14, M = 60, S = (W - 2*M - 4*GAP) / 5;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const c = cv.getContext("2d");
    c.fillStyle = "#e82a8f"; c.fillRect(0, 0, W, H);
    [[260, 760, 520], [940, 1280, 430]].forEach(([x, y, r]) => {
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "#c9e3f8"); g.addColorStop(1, "rgba(232,42,143,0)");
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    });
    await document.fonts.load('400 150px "gunter"');
    c.fillStyle = "#cdd9f3"; c.font = '400 150px "gunter"';
    c.textAlign = "left"; c.fillText("hello", M, 190);
    c.textAlign = "right"; c.fillText("bingo", W - M, 330);
    const imgs = await Promise.all(cells.map(cell => loadImg(urlFor(subs[cell.id]))));
    imgs.forEach((im, i) => {
      const x = M + (i % 5) * (S + GAP), y = 400 + Math.floor(i / 5) * (S + GAP);
      const k = Math.max(S / im.width, S / im.height), w = im.width * k, h = im.height * k;
      c.save(); c.beginPath(); c.rect(x, y, S, S); c.clip();
      c.drawImage(im, x + (S - w) / 2, y + (S - h) / 2, w, h); c.restore();
    });
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    const f = new File([blob], "hello-bingo.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {   // phones: share sheet, then "Save Image"
      try { await navigator.share({ files: [f] }); say(""); return; }
      catch (e) { if (e.name === "AbortError") { say(""); return; } }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "hello-bingo.png"; a.click();
    say("");
  } catch (err) { say("Could not make the image: " + (err.message || err)); }
};

init();
</script>
</body>
</html>
