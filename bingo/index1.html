<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hello bingo</title>
<link rel="stylesheet" href="https://use.typekit.net/pgu7sez.css">
<style>
:root{--pink:#e82a8f;--ice:#cdd9f3;--glow:#c9e3f8;--deep:#b3126a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;background:var(--pink);color:var(--ice);font-family:"neue-haas-grotesk-text",system-ui,sans-serif;font-weight:700;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{width:100%;max-width:520px;height:100%;margin:0 auto;padding-top:10dvh;position:relative;z-index:1;display:flex;flex-direction:column}
body.view #app{visibility:hidden}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,#e6a3cb 38%,rgba(232,42,143,0) 70%);animation:breathe 7s ease-in-out infinite alternate}
.o1{width:min(110vw,760px);aspect-ratio:1;top:-8vh;right:-25vw}
.o2{--r:min(40vw,280px);width:calc(var(--r)*2);aspect-ratio:1;top:calc(56% - var(--r));left:-32vw;animation-delay:-2.5s;animation-duration:9s}
.o3{width:min(80vw,560px);aspect-ratio:1;bottom:-6vh;right:-30vw;animation-delay:-5s;animation-duration:8s}
@keyframes breathe{from{transform:scale(.9);opacity:.7}to{transform:scale(1.12);opacity:1}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
h1{margin:0 0 1.5dvh;font-family:"gunter",sans-serif;font-weight:400;font-size:min(17vw,8.6dvh);line-height:.88;letter-spacing:-.02em;text-transform:lowercase}
h1 span{display:block}
h1 span+span{text-align:right}
#sub{margin:0 0 1dvh;text-align:center;font-family:"gunter",sans-serif;font-weight:400;font-size:min(8vw,4dvh);line-height:1}
#sub:empty{display:none}
#banner{text-align:center;font-weight:800;font-size:min(4.5vw,2.4dvh);min-height:1.3em}
#gw{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
#grid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
.cell{border:0;padding:3px;min-width:0;min-height:0;font-family:"neue-haas-grotesk-display",sans-serif;font-size:clamp(.55rem,2.8vw,.8rem);font-weight:700;line-height:1.1;overflow-wrap:anywhere;hyphens:auto;color:#fff;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:0;background:var(--pink);box-shadow:inset 0 0 0 1.5px rgba(205,217,243,.55);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell.done{background:none;box-shadow:0 0 0 2px var(--ice),0 0 16px rgba(201,227,248,.6);z-index:1}
.cell.busy{opacity:.5}
.ring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid var(--ice);border-radius:50%;pointer-events:none}
#acts{display:flex;justify-content:center;gap:10px;margin-top:1.5dvh}
.pill{font-family:"gunter",sans-serif;font-weight:400;font-size:min(6vw,3dvh);padding:1.4dvh 22px;border:0;border-radius:999px;background:var(--ice);color:var(--pink);cursor:pointer;text-transform:lowercase}
#msg{min-height:1.3em;margin-top:.8dvh;text-align:center;font-size:.8rem}
#join{display:flex;gap:8px;margin:22px 0}
input[type=text]{flex:1;min-width:0;font:inherit;padding:13px 16px;border-radius:999px;border:0;color:var(--deep)}
#go{font:inherit;font-weight:800;padding:13px 20px;border:0;border-radius:999px;background:var(--ice);color:var(--pink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
#viewer{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;gap:2dvh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
body.view #viewer{display:flex}
#vt{margin:5dvh 0 0;max-width:520px;text-align:center;color:#fff;font-family:"neue-haas-grotesk-display",sans-serif;font-size:clamp(1rem,5vw,1.4rem);line-height:1.15}
#big{flex:1;min-height:0;max-width:100%;object-fit:contain}
#vb{display:flex;gap:10px;width:100%;max-width:520px}
#vb .pill{flex:1;padding:1.6dvh 8px}
#close{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;width:40px;height:40px;border:0;border-radius:50%;background:var(--ice);color:var(--pink);font-size:1.2rem;cursor:pointer}
#rot{position:fixed;inset:0;z-index:100;background:var(--pink);display:none;align-items:center;justify-content:center;font-family:"gunter",sans-serif;font-weight:400;font-size:2rem;color:var(--ice);text-align:center}
@media (orientation:landscape) and (max-height:600px){#rot{display:flex}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="app">
  <h1><span>hello</span><span>bingo</span></h1>
  <p id="sub"></p>
  <div id="join" hidden>
    <input id="name" type="text" placeholder="Your name" maxlength="30" aria-label="Your name">
    <button id="go">aizie bļe</button>
  </div>
  <div id="banner" aria-live="polite"></div>
  <div id="gw"><div id="grid"></div></div>
  <div id="acts" hidden>
    <button id="dl" class="pill">noladet</button>
    <button id="ig" class="pill" hidden>instagram</button>
  </div>
  <div id="msg" aria-live="polite"></div>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="viewer">
  <button id="close" aria-label="Close">✕</button>
  <p id="vt"></p>
  <img id="big" alt="Submitted photo">
  <div id="vb"><button id="vdl" class="pill">noladet</button><button id="replace" class="pill">upsii, velvienu</button></div>
</div>
<div id="rot">pagriez telefonu ↻</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.min.js"></script>
<script>
const SUPABASE_URL = "https://archhxegbrzpaqwrzakh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyY2hoeGVnYnJ6cGFxd3J6YWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NDk5ODksImV4cCI6MjEwOTQyNTk4OX0.m0DgPAU_IUN7dAIa_SMMKis8nLNnEVDgw3GbOU2DBKk";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let me, cells = [], subs = {}, activeCell = null, ready = null;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
try { screen.orientation.lock("portrait").catch(() => {}); } catch (e) {}

const LINES = [];
for (let i = 0; i < 5; i++) LINES.push([0,1,2,3,4].map(j => i*5+j), [0,1,2,3,4].map(j => j*5+i));
LINES.push([0,6,12,18,24], [4,8,12,16,20]);

const say = t => $("msg").textContent = t || "";
const urlFor = s => sb.storage.from("bingo").getPublicUrl(s.path).data.publicUrl + "?v=" + encodeURIComponent(s.created_at);

async function init() {
  let { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const { data, error } = await sb.auth.signInAnonymously();
    if (error) return say("Could not sign in: " + error.message);
    session = data.session;
  }
  me = session.user;
  const { data: player } = await sb.from("players").select("*").eq("id", me.id).maybeSingle();
  if (!player) { $("join").hidden = false; return; }
  start(player);
}

$("go").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) return say("Enter a name first.");
  const { data, error } = await sb.from("players").insert({ id: me.id, name }).select().single();
  if (error) return say("Could not save name: " + error.message);
  $("join").hidden = true; say(""); start(data);
};

async function start(player) {
  $("sub").textContent = "ciu " + player.name + "!"; $("acts").hidden = false;
  const [c, s] = await Promise.all([
    sb.from("cells").select("*").order("id"),
    sb.from("submissions").select("*").eq("player_id", me.id)
  ]);
  if (c.error || s.error) return say("Could not load the card.");
  cells = c.data; s.data.forEach(r => subs[r.cell_id] = r);
  render();
}

function render() {
  const g = $("grid"); g.innerHTML = "";
  cells.forEach(cell => {
    const b = document.createElement("button");
    b.className = "cell"; b.dataset.id = cell.id;
    const s = subs[cell.id];
    if (s) {
      b.classList.add("done");
      const im = document.createElement("img");
      im.crossOrigin = "anonymous"; im.alt = cell.label; im.src = urlFor(s);
      b.appendChild(im);
    } else b.textContent = cell.label;
    b.onclick = () => s ? openViewer(cell.id) : pick(cell.id);
    g.appendChild(b);
  });
  const full = Object.keys(subs).length === 25;
  $("banner").textContent = full ? "Full card!" : "";
  $("ig").hidden = !full;
  ready = null;
}

// ---------- animations ----------
const cellEl = id => $("grid").querySelector('[data-id="' + id + '"]');
function pop(id, delay, scale) {
  const el = cellEl(id);
  if (el && !calm) el.animate([{ transform: "scale(1)" }, { transform: "scale(" + scale + ")" }, { transform: "scale(1)" }],
    { duration: 520, delay, easing: "ease-in-out" });
}
function celebrate(id, before) {
  const after = new Set(before).add(id);
  if (after.size === 25) return ripple(id);
  const lines = LINES.filter(l => l.includes(id) && l.every(i => after.has(i)));
  if (!lines.length) return pop(id, 0, 1.12);
  const delays = new Map();
  lines.forEach(l => {
    const k = l.indexOf(id);
    l.forEach((cid, idx) => {
      const d = Math.abs(idx - k) * 90;
      delays.set(cid, Math.min(d, delays.has(cid) ? delays.get(cid) : d));
    });
  });
  delays.forEach((d, cid) => pop(cid, d, cid === id ? 1.22 : 1.16));
}
function ripple(id) {
  const x0 = id % 5, y0 = Math.floor(id / 5), step = 110;
  for (let cid = 0; cid < 25; cid++) pop(cid, Math.hypot((cid % 5) - x0, Math.floor(cid / 5) - y0) * step, 1.25);
  const el = cellEl(id), g = $("grid");
  if (!el || calm) return;
  const ring = document.createElement("div");
  ring.className = "ring";
  ring.style.left = el.offsetLeft + el.offsetWidth / 2 + "px";
  ring.style.top = el.offsetTop + el.offsetHeight / 2 + "px";
  g.appendChild(ring);
  ring.animate([{ transform: "scale(1)", opacity: .9 }, { transform: "scale(" + (12 * el.offsetWidth / 20) + ")", opacity: 0 }],
    { duration: 6 * step, easing: "linear" }).onfinish = () => ring.remove();
}

// ---------- viewer + upload ----------
function pick(id) { activeCell = id; $("file").value = ""; $("file").click(); }
function openViewer(id) {
  activeCell = id;
  $("vt").textContent = cells.find(c => c.id === id).label;
  $("big").src = urlFor(subs[id]);
  document.body.classList.add("view");
}
const closeViewer = () => document.body.classList.remove("view");
$("close").onclick = closeViewer;
$("replace").onclick = () => { closeViewer(); pick(activeCell); };
$("vdl").onclick = async () => {
  try {
    const im = await loadImg(urlFor(subs[activeCell]));
    const cv = document.createElement("canvas"); cv.width = im.naturalWidth; cv.height = im.naturalHeight;
    cv.getContext("2d").drawImage(im, 0, 0);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
    await deliver([new File([blob], "hello-bingo-" + (activeCell + 1) + ".jpg", { type: "image/jpeg" })]);
  } catch (err) { say("Could not save: " + (err.message || err)); }
};

async function compress(file, max = 1600) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let blob = await new Promise(r => cv.toBlob(r, "image/webp", 0.8));
  if (!blob || blob.type !== "image/webp") blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.8));
  return blob;
}

$("file").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  const id = activeCell, el = cellEl(id);
  el.classList.add("busy"); say("Uploading…");
  try {
    const blob = await compress(file);
    const path = me.id + "/" + id + (blob.type === "image/webp" ? ".webp" : ".jpg");
    const up = await sb.storage.from("bingo").upload(path, blob, { upsert: true, contentType: blob.type });
    if (up.error) throw up.error;
    const row = { player_id: me.id, cell_id: id, path, created_at: new Date().toISOString() };
    const { error } = await sb.from("submissions").upsert(row);
    if (error) throw error;
    const before = new Set(Object.keys(subs).map(Number)), wasNew = !subs[id];
    subs[id] = row; say(""); render();
    wasNew ? celebrate(id, before) : pop(id, 0, 1.12);
  } catch (err) {
    say("Upload failed: " + (err.message || err)); el.classList.remove("busy");
  }
};

// ---------- instagram ----------
$("ig").onclick = () => {
  location.href = "instagram://story-camera";
  setTimeout(() => { if (!document.hidden) location.href = "https://www.instagram.com/"; }, 1500);
};

// ---------- exports (png x2 + video), all 1080x1920 ----------
const loadImg = u => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = rej; i.src = u; });
const W = 1080, H = 1920, M = 60, GAP = 14, S = (W - 2*M - 4*GAP) / 5, GY = 620, FPS = 30;
const pos = i => [M + (i % 5) * (S + GAP), GY + Math.floor(i / 5) * (S + GAP)];
const sm = x => { x = Math.min(1, Math.max(0, x)); return x*x*(3 - 2*x); };

function wrap(c, text, cx, cy, maxW, lh) {
  const words = String(text).split(/\s+/), lines = []; let cur = "";
  words.forEach(w => { const t = cur ? cur + " " + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  lines.push(cur);
  lines.forEach((l, i) => c.fillText(l, cx, cy + (i - (lines.length - 1) / 2) * lh));
}

function makeBase() {
  const b = document.createElement("canvas"); b.width = W; b.height = H;
  const c = b.getContext("2d");
  c.fillStyle = "#e82a8f"; c.fillRect(0, 0, W, H);
  [[260, 900, 620], [940, 1560, 520], [900, 220, 480]].forEach(([x, y, r]) => {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "#c9e3f8"); g.addColorStop(1, "rgba(232,42,143,0)");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  });
  c.fillStyle = "#cdd9f3"; c.font = '400 190px "gunter"';
  c.textAlign = "left"; c.fillText("hello", M, 300);
  c.textAlign = "right"; c.fillText("bingo", W - M, 470);
  c.textBaseline = "middle"; c.textAlign = "center";
  cells.forEach((cell, i) => {
    const [x, y] = pos(i);
    c.fillStyle = "#e82a8f"; c.fillRect(x, y, S, S);
    c.strokeStyle = "rgba(205,217,243,.55)"; c.lineWidth = 3; c.strokeRect(x + 1.5, y + 1.5, S - 3, S - 3);
    c.fillStyle = "#fff"; c.font = '700 25px "neue-haas-grotesk-display"';
    wrap(c, cell.label, x + S/2, y + S/2, S - 16, 28);
  });
  return b;
}

function tile(c, im, i, a, glow) {
  const [x, y] = pos(i);
  c.save(); c.globalAlpha = a;
  if (glow) { c.shadowColor = "rgba(201,227,248,1)"; c.shadowBlur = 55; c.fillStyle = "#cdd9f3"; c.fillRect(x, y, S, S); c.shadowBlur = 0; }
  c.beginPath(); c.rect(x, y, S, S); c.clip();
  const k = Math.max(S / im.width, S / im.height), w = im.width * k, h = im.height * k;
  c.drawImage(im, x + (S - w) / 2, y + (S - h) / 2, w, h);
  c.restore();
  c.save(); c.globalAlpha = a; c.strokeStyle = "#cdd9f3"; c.lineWidth = 4; c.strokeRect(x + 2, y + 2, S - 4, S - 4); c.restore();
}

// timeline: 1s empty, sliding window of 5 images (chronological), pause, 3s twinkle, slow reveal, fast fade out
function plan(N) {
  const F = .8, st = Math.min(.6, Math.max(.12, 6.2 / (N + 4)));
  const e1 = 1 + (N + 4) * st + F, tw = e1 + .5, rv = tw + 3;
  return { F, st, tw, rv, DUR: rv + 1.6 + .3 + .4 + .4 };
}
function alphaOf(k, t, p) {
  if (t < p.tw) return [sm((t - (1 + k*p.st)) / p.F) * (1 - sm((t - (1 + (k + 5)*p.st)) / p.F)), false];
  if (t < p.rv) {
    const u = (t - p.tw) / 3, env = Math.min(1, 5*u, 5*(1 - u)), ph = k * 2.399;
    const f = .5 + .5 * Math.sin(t * (5 + k % 5) + ph) * (.6 + .4 * Math.sin(t * 2.3 + ph * 1.7));
    return [f * f * env, true];
  }
  const r = t - p.rv;
  return [r < 1.9 ? sm(r / 1.6) : 1 - sm((r - 1.9) / .4), r < 1.9];
}

async function makeVideo(base, items) {
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const c = cv.getContext("2d"), p = plan(items.length), total = Math.ceil(p.DUR * FPS);
  const draw = t => {
    c.drawImage(base, 0, 0);
    items.forEach((it, k) => { const [a, g] = alphaOf(k, t, p); if (a > .003) tile(c, it.im, it.i, a, g); });
  };
  const cfg = { codec: "avc1.640029", width: W, height: H, bitrate: 6e6, framerate: FPS };
  if (window.VideoEncoder && window.Mp4Muxer) try {
    if (!(await VideoEncoder.isConfigSupported(cfg)).supported) throw 0;
    let fail = null;
    const target = new Mp4Muxer.ArrayBufferTarget();
    const mux = new Mp4Muxer.Muxer({ target, video: { codec: "avc", width: W, height: H }, fastStart: "in-memory" });
    const enc = new VideoEncoder({ output: (ch, m) => { try { mux.addVideoChunk(ch, m); } catch (e) { fail = e; } }, error: e => { fail = e; } });
    enc.configure(cfg);
    for (let f = 0; f < total; f++) {
      if (fail) throw fail;
      draw(f / FPS);
      const vf = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      enc.encode(vf, { keyFrame: f % 60 === 0 }); vf.close();
      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
      if (f % 15 === 0) { say("Taisu video… " + Math.round(100 * f / total) + "%"); await new Promise(r => setTimeout(r)); }
    }
    await enc.flush(); if (fail) throw fail; mux.finalize();
    return new File([target.buffer], "hello-bingo.mp4", { type: "video/mp4" });
  } catch (e) { console.warn("fast encoder failed, recording instead", e); }
  // fallback: real-time recording
  const mt = ["video/mp4", "video/webm;codecs=vp9", "video/webm"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mt) throw new Error("video not supported on this browser");
  return new Promise(res => {
    const rec = new MediaRecorder(cv.captureStream(FPS), { mimeType: mt, videoBitsPerSecond: 6e6 }), chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => res(new File(chunks, "hello-bingo." + (mt.startsWith("video/mp4") ? "mp4" : "webm"), { type: mt }));
    rec.start(); const t0 = performance.now();
    (function loop() {
      const t = (performance.now() - t0) / 1000;
      if (t >= p.DUR) return rec.stop();
      draw(t); say("Taisu video… " + Math.round(100 * t / p.DUR) + "%"); requestAnimationFrame(loop);
    })();
  });
}

async function deliver(files) {
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); say(""); return; }
    catch (e) {
      if (e.name === "AbortError") { say(""); return; }
      if (e.name === "NotAllowedError") { ready = files; say("Gatavs! Nospied vēlreiz."); return; }
    }
  }
  for (const f of files) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(f); a.download = f.name; a.click();
    await new Promise(r => setTimeout(r, 500));
  }
  say("");
}

$("dl").onclick = async () => {
  if (ready) { const f = ready; ready = null; return deliver(f); }
  $("dl").disabled = true; say("Taisu bingo…");
  try {
    await Promise.all([document.fonts.load('400 190px "gunter"'), document.fonts.load('700 25px "neue-haas-grotesk-display"')]);
    const items = await Promise.all(Object.values(subs)
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
      .map(async s => ({ im: await loadImg(urlFor(s)), i: cells.findIndex(c => c.id === s.cell_id) })));
    const base = makeBase();
    const png = cv => new Promise(r => cv.toBlob(r, "image/png"));
    const cur = document.createElement("canvas"); cur.width = W; cur.height = H;
    const cc = cur.getContext("2d"); cc.drawImage(base, 0, 0);
    items.forEach(it => tile(cc, it.im, it.i, 1, false));
    const files = [
      new File([await png(cur)], "hello-bingo.png", { type: "image/png" }),
      new File([await png(base)], "hello-bingo-empty.png", { type: "image/png" })
    ];
    files.push(await makeVideo(base, items));
    say(""); await deliver(files);
  } catch (err) { say("Could not make it: " + (err.message || err)); }
  $("dl").disabled = false;
};

init();
</script>
